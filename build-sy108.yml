name: SY108 audited source build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Firmware profiles to build (both is recommended)
        type: choice
        required: true
        default: both
        options: [both, main, recovery]

permissions:
  contents: read

concurrency:
  group: sy108-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      SY108_PYTHON: python3
      SY108_JOBS: "4"
      SY108_MEMORY: "10g"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout this workflow and the verification helper
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the audited platform commit from your fork
        uses: actions/checkout@v7.0.1
        with:
          ref: bf33ea983816a34c44db51d4587b0b76fc59cba3
          path: source
          persist-credentials: false

      - name: Check the runner and source locks
        run: |
          set -euo pipefail
          mkdir -p ../diagnostics
          {
            uname -a
            python3 --version
            git --version
            gzip --version
            docker version
            free -h
            df -h .
            git rev-parse HEAD
          } 2>&1 | tee ../diagnostics/00-environment.log
          test "$(uname -m)" = aarch64
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          assert sys.version_info >= (3, 12), 'Python 3.12+ is required'
          lock = json.loads(Path('manifests/openwrt.json').read_text())
          assert lock['upstream_commit'] == 'f0a60eee2fe051741c643ea6118718aae1ef17fb'
          PY
          cp manifests/kernel.json ../diagnostics/kernel.original.json
          cp manifests/openwrt.json ../diagnostics/openwrt.lock.json
          cp integration/openwrt/feeds.conf ../diagnostics/feeds.lock.conf

      - name: Free optional SDK space on the disposable GitHub runner
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h . | tee ../diagnostics/00-disk-after-cleanup.log

      - name: Require a working disk budget
        run: |
          set -euo pipefail
          # 30 GiB is a conservative working budget, not a measured minimum.
          free_kib=$(df -Pk . | awk 'NR==2 {print $4}')
          if (( free_kib < 30 * 1024 * 1024 )); then
            echo '::error::Less than 30 GiB free. Use a larger ARM64 runner; see README-zh-CN.txt.'
            exit 1
          fi

      - name: Restore source downloads only
        uses: actions/cache@v6.1.0
        with:
          path: source/out/downloads
          key: sy108-downloads-arm64-audit-v1-${{ hashFiles('source/manifests/*.json', 'source/integration/openwrt/feeds.conf') }}

      - name: Verify the complete kernel archive and apply its audited hash
        run: |
          set -euo pipefail
          python3 ../ci/prepare_kernel.py --project . \
            --report ../diagnostics/kernel-source-verification.json \
            2>&1 | tee ../diagnostics/01-kernel-verification.log
          cp manifests/kernel.json ../diagnostics/kernel.effective.json
          git diff -- manifests/kernel.json > ../diagnostics/kernel-lock-change.patch

      - name: Bootstrap the locked OpenWrt tree
        run: |
          set -euo pipefail
          python3 tools/bootstrap.py \
            --openwrt-url https://github.com/openwrt/openwrt.git \
            2>&1 | tee ../diagnostics/02-bootstrap.log

      - name: Build main firmware
        if: inputs.profile != 'recovery'
        run: |
          set -euo pipefail
          python3 tools/build/firmware.py main --jobs 4 \
            2>&1 | tee ../diagnostics/03-main.log

      - name: Build independent Recovery firmware
        if: inputs.profile != 'main'
        run: |
          set -euo pipefail
          python3 tools/build/firmware.py recovery --jobs 4 \
            2>&1 | tee ../diagnostics/04-recovery.log

      - name: Validate deliverables and write checksums
        env:
          BUILD_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_PROFILE" != recovery ]]; then
            test -s out/images/main/boot.bin
            test -s out/images/main/rootfs.squashfs
            test -s out/images/main/sysupgrade.bin
            test -s out/images/main/build.json
          fi
          if [[ "$BUILD_PROFILE" != main ]]; then
            test -s out/images/recovery/boot.bin
            test -s out/images/recovery/rootfs.cpio.gz
            test -s out/images/recovery/build.json
          fi
          cp ../diagnostics/kernel-source-verification.json out/images/
          cp ../diagnostics/kernel-lock-change.patch out/images/
          cd out/images
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload successful firmware
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sy108-firmware-${{ inputs.profile }}-${{ github.run_number }}
          path: source/out/images/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Collect available diagnostics
        if: always()
        working-directory: .
        run: |
          set -u
          mkdir -p diagnostics
          df -h > diagnostics/final-disk.log
          free -h > diagnostics/final-memory.log
          if [[ -d source ]]; then
            git -C source status --short > diagnostics/source-status.txt
            git -C source diff > diagnostics/source-changes.patch
            if [[ -f source/out/openwrt-build/.config ]]; then
              cp source/out/openwrt-build/.config diagnostics/openwrt-last.config
            fi
            if [[ -d source/out/openwrt-build/logs ]]; then
              tar -czf diagnostics/openwrt-package-logs.tar.gz -C source/out/openwrt-build logs
            fi
          fi

      - name: Upload diagnostics even if a build failed
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sy108-diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
