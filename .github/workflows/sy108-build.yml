
name: SY108 Mainline Cloud Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Select firmware profile"
        required: true
        type: choice
        default: both
        options:
          - main
          - recovery
          - both

permissions:
  contents: read

concurrency:
  group: sy108-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Requires an available GitHub-hosted ARM64 runner.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    env:
      SY108_PYTHON: python3
      SY108_JOBS: "4"
      SY108_MEMORY: 12g
      SY108_OUT: ${{ github.workspace }}/out

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check runner and Docker
        run: |
          set -eux
          uname -m
          python3 --version
          docker version
          docker info
          df -h
          mkdir -p out/downloads out/ccache

      - name: Restore download and compiler caches
        uses: actions/cache@v4
        with:
          path: |
            out/downloads
            out/ccache
          key: sy108-arm64-${{ runner.os }}-${{ hashFiles('manifests/kernel.json', 'manifests/openwrt.json') }}-${{ github.sha }}
          restore-keys: |
            sy108-arm64-${{ runner.os }}-${{ hashFiles('manifests/kernel.json', 'manifests/openwrt.json') }}-
            sy108-arm64-${{ runner.os }}-

      - name: Bootstrap OpenWrt build tree
        run: tools/python tools/bootstrap.py

      - name: Build main firmware
        if: inputs.profile == 'main' || inputs.profile == 'both'
        run: tools/python tools/build/firmware.py main --jobs 4

      - name: Build recovery firmware
        if: inputs.profile == 'recovery' || inputs.profile == 'both'
        run: tools/python tools/build/firmware.py recovery --jobs 4

      - name: Show firmware files
        if: always()
        run: |
          echo "===== Disk usage ====="
          df -h
          echo "===== Build outputs ====="
          find out/images -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sy108-${{ inputs.profile }}-${{ github.sha }}
          path: out/images/
          if-no-files-found: error
          retention-days: 14
